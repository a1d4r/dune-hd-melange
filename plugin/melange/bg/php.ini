[php]
; php.ini of the pass over the cards of the shell (bg/lib_map.php): php-cgi -q -c <this folder>, started by php_server.
cgi.force_redirect = 0
; php-cgi has 30 s by default: 0 here, the pass stops itself (MEL_PG_BG_WORK_S), timeout of the command kills it.
max_execution_time = 0
memory_limit = 128M
error_reporting = E_ALL
display_errors = Off
; To stderr: lib_map.log of tmp_dir.
log_errors = On
expose_php = Off
output_buffering = 0
file_uploads = Off
