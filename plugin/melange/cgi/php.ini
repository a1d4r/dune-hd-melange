[php]
cgi.force_redirect = 0
cgi.redirect_status_env = yes
error_reporting = E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED & ~E_WARNING
magic_quotes_gpc = 0
; PHP 5.3.6 has no max_input_vars: cap the body (hash-collision DoS from the LAN).
; 256K: the import of a backup with "My List" (MEL_CGI_IMPORT_MAX); a body of
; colliding keys this long takes ~0.2 s of PHP 5.3.6 on a desktop core (32K: 0.004 s).
post_max_size = 256K
file_uploads = Off
display_errors = Off
; No X-Powered-By header.
expose_php = Off
