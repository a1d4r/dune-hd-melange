[php]
cgi.force_redirect = 0
cgi.redirect_status_env = yes
error_reporting = E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED & ~E_WARNING
magic_quotes_gpc = 0
; PHP 5.3.6 has no max_input_vars: cap the body (hash-collision DoS from the LAN).
; 1M: the import of a backup with "My List" and the hidden titles (MEL_CGI_IMPORT_MAX).
; A body of colliding keys this long takes PHP 5.3.6 on a desktop core (M1 Pro)
; ~13 s of integer keys (the worst), ~2 s of string ones; 256K: 0.7 s, 0.15 s.
post_max_size = 1M
file_uploads = Off
display_errors = Off
; No X-Powered-By header.
expose_php = Off
