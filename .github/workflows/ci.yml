name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck zip php-cli
      # The page script (plugin/melange/web) is checked by build.sh with the
      # bun of its packageManager field: another bun may minify otherwise.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: plugin/melange/web/package.json
      - name: Shellcheck, php -l, build
        run: sh build.sh
      # Placeholders, cut out before the check: the address 192.168.1.10 (with a
      # port or without, also URL-encoded) and the test UUIDs
      # 00000000-0000-4000-8000-*. Anything else left on a line fails.
      - name: No private IPs or UUIDs
        run: |
          pat='192\.168\.|(^|[^0-9.])10\.[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          if git grep -n -I -E "$pat" -- ':!.github' |
            sed -E 's/192\.168\.1\.10([^0-9.]|$)/\1/g; s/00000000-0000-4000-8000-[0-9a-f]{12}//g' |
            grep -E "$pat"; then
            echo "::error::private IP or UUID in tracked files"
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
