name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck zip php-cli
      # The page script (plugin/melange/web) is checked by build.sh with the
      # bun of its packageManager field: another bun may minify otherwise.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: plugin/melange/web/package.json
      - name: Shellcheck, php -l, build
        run: sh build.sh
      # 192.168.1.10:<port> is the neutral placeholder of the settings page; the
      # page script tests (web/test) use it without a port and zero UUIDs.
      - name: No private IPs or UUIDs
        run: |
          if git grep -n -I -E '192\.168\.|(^|[^0-9.])10\.[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' -- ':!.github' ':!plugin/melange/web/test' |
            grep -v '192\.168\.1\.10:'; then
            echo "::error::private IP or UUID in tracked files"
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
