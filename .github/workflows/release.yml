name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag matches the plugin version
        run: |
          v=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' plugin/melange/dune_plugin.xml)
          test "$GITHUB_REF_NAME" = "v$v" || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
      # Dunes update only to a greater version_index: a new archive under an
      # already published one would never reach them. Compared with every
      # other v* tag, not only the nearest: a hotfix on an old branch counts.
      - name: version_index is greater than in all other tags
        run: |
          m=plugin/melange/dune_plugin.xml
          vindex() { sed -n 's:.*<version_index>\(.*\)</version_index>.*:\1:p'; }
          cur=$(vindex <"$m")
          max=
          for t in $(git tag --list 'v*'); do
            [ "$t" != "$GITHUB_REF_NAME" ] || continue
            v=$(git show "$t:$m" 2>/dev/null | vindex || true)
            case "$v" in '' | *[!0-9]*) echo "$t: no version_index, skipped"; continue ;; esac
            if [ -z "$max" ] || [ "$v" -gt "$max" ]; then max=$v; at=$t; fi
          done
          [ -n "$max" ] || { echo "no other v* tag with version_index, check skipped"; exit 0; }
          echo "version_index: at most $max ($at), $cur at $GITHUB_REF_NAME"
          [ "$cur" -gt "$max" ] || { echo "::error::version_index $cur is not greater than $max at $at"; exit 1; }
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck zip php-cli
      - name: Build
        run: sh build.sh
      - name: Release notes
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          {
            echo "Скачайте zip ниже, в Assets. Установка — в [README]($base/README.md)."
            echo "Для ручной установки нужен zip; \`.tar.gz\` — тот же плагин для онлайн-обновления."
            echo
            echo "Что нового — в [CHANGELOG]($base/CHANGELOG.md)."
          } > notes.md
          cat notes.md
      # The online update channel: dist/pages/melange/update_info.xml and the
      # archive it points to. Each deploy replaces the whole site. Uploaded
      # before the release, so a failed upload leaves no half-done release.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/pages/*/*.tar.gz --title "Melange $GITHUB_REF_NAME" --notes-file notes.md

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
